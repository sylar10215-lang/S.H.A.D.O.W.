<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.H.A.D.O.W. // GitHub AI Interface</title>
  <style>
    :root {
      --bg-main: #0b0d10;
      --bg-panel: #13171d;
      --bg-input: #1b2028;
      --accent: #00a8ff;
      --accent-hover: #0086cc;
      --text-main: #e4e8ee;
      --text-dim: #8a94a6;
      --border: #262d38;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: var(--bg-panel);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent);
      font-size: 16px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff4757;
      display: inline-block;
    }
    .status-dot.online { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: flex-end;
      min-width: 240px;
    }
    select, input, textarea, button {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--accent); }
    select { max-width: 220px; width: 100%; cursor: pointer; }
    button { cursor: pointer; transition: 0.15s; }
    button:hover { background: #252c37; }
    button.primary { background: var(--accent); color: #000; font-weight: 700; border: none; }
    button.primary:hover { background: var(--accent-hover); color: #fff; }

    #settingsPanel {
      display: none;
      background: var(--bg-panel);
      padding: 16px;
      border-bottom: 1px solid var(--border);
      flex-direction: column;
      gap: 12px;
    }
    #settingsPanel.open { display: flex; }
    .setting-row { display: flex; flex-direction: column; gap: 6px; }
    .setting-row label { font-size: 12px; color: var(--text-dim); font-weight: 600; }
    .setting-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
    @media (max-width: 700px) { .setting-grid { grid-template-columns: 1fr; } }
    textarea { resize: vertical; min-height: 70px; font-family: inherit; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      background: #005580;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }
    .ai {
      background: var(--bg-panel);
      align-self: flex-start;
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }
    .msg img {
      max-width: 240px;
      border-radius: 8px;
      display: block;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    footer {
      background: var(--bg-panel);
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      align-items: center;
    }
    .file-btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .file-btn.has-file { border-color: var(--accent); color: var(--accent); }
    .file-btn input[type=file] {
      position: absolute;
      left: 0; top: 0; opacity: 0;
      width: 100%; height: 100%; cursor: pointer;
    }
    #prompt { flex: 1; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <span id="statusDot" class="status-dot" title="สถานะการเชื่อมต่อ Ollama"></span>
    <span>S.H.A.D.O.W.</span>
  </div>
  <div class="controls">
    <select id="modelSelect" title="เลือกโมเดลบนโน้ตบุ๊ก">
      <option value="">กำลังโหลดรายชื่อโมเดล...</option>
    </select>
    <button onclick="fetchModels()" title="รีเฟรชรายชื่อโมเดล">↻</button>
    <button onclick="toggleSettings()" title="ตั้งค่า">⚙️</button>
    <button onclick="clearChat()" title="ล้างหน้าแชต">🗑️</button>
  </div>
</header>

<div id="settingsPanel">
  <div class="setting-grid">
    <div class="setting-row">
      <label>OLLAMA URL (แนะนำลิงก์ https://... จาก Cloudflare Tunnel)</label>
      <input type="text" id="serverUrl" placeholder="https://xxxx.trycloudflare.com">
    </div>
    <div class="setting-row">
      <label>NUM_CTX</label>
      <input type="number" id="numCtx" value="2048">
    </div>
  </div>
  <div class="setting-row">
    <label>SYSTEM PROMPT</label>
    <textarea id="systemPrompt"><|think|>off คุณคือ S.H.A.D.O.W. ผู้ช่วย AI ส่วนตัวของ MJ ตอบสั้น กระชับ ตรงประเด็นที่สุด ไม่ต้องอารัมภบท</textarea>
  </div>
  <div style="display: flex; justify-content: flex-end; gap: 8px;">
    <button class="primary" onclick="saveSettings()">บันทึกการตั้งค่า</button>
  </div>
</div>

<div id="chat"></div>

<footer>
  <label class="file-btn" id="fileLabel" title="แนบรูปภาพ">
    📷
    <input type="file" id="imageInput" accept="image/*" onchange="updateFileBadge()">
  </label>
  <input type="text" id="prompt" placeholder="ป้อนคำสั่งให้ S.H.A.D.O.W. ..." onkeypress="if(event.key==='Enter') send()">
  <button class="primary" onclick="send()">ส่ง</button>
</footer>

<script>
  let chatHistory = [];

  window.onload = async () => {
    // รองรับการส่งลิงก์ผ่าน query string เช่น ?url=https://...
    const params = new URLSearchParams(window.location.search);
    const queryUrl = params.get('url');

    if (queryUrl) {
      document.getElementById('serverUrl').value = queryUrl.trim();
      localStorage.setItem('shadow_url', queryUrl.trim());
    } else if (localStorage.getItem('shadow_url')) {
      document.getElementById('serverUrl').value = localStorage.getItem('shadow_url');
    }

    if (localStorage.getItem('shadow_ctx')) {
      document.getElementById('numCtx').value = localStorage.getItem('shadow_ctx');
    }
    if (localStorage.getItem('shadow_sys')) {
      document.getElementById('systemPrompt').value = localStorage.getItem('shadow_sys');
    }

    // ถ้ามี config.json ใน repo ให้ใช้เป็นค่าตั้งต้นเฉพาะตอนที่เครื่องยังไม่เคยตั้งค่าเอง
    if (!localStorage.getItem('shadow_url')) {
      try {
        const res = await fetch('./config.json?t=' + Date.now());
        if (res.ok) {
          const cfg = await res.json();
          if (cfg.serverUrl) {
            document.getElementById('serverUrl').value = cfg.serverUrl;
          }
          if (cfg.numCtx && !localStorage.getItem('shadow_ctx')) {
            document.getElementById('numCtx').value = cfg.numCtx;
          }
          if (typeof cfg.systemPrompt === 'string' && !localStorage.getItem('shadow_sys')) {
            document.getElementById('systemPrompt').value = cfg.systemPrompt;
          }
        }
      } catch (e) {}
    }

    fetchModels();
  };

  function toggleSettings() {
    document.getElementById('settingsPanel').classList.toggle('open');
  }

  function saveSettings() {
    const cleanUrl = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');
    document.getElementById('serverUrl').value = cleanUrl;
    localStorage.setItem('shadow_url', cleanUrl);
    localStorage.setItem('shadow_ctx', document.getElementById('numCtx').value);
    localStorage.setItem('shadow_sys', document.getElementById('systemPrompt').value);
    toggleSettings();
    fetchModels();
  }

  function updateFileBadge() {
    const file = document.getElementById('imageInput').files[0];
    const label = document.getElementById('fileLabel');
    if (file) {
      label.classList.add('has-file');
      label.childNodes[0].nodeValue = "🖼️ ";
    } else {
      label.classList.remove('has-file');
      label.childNodes[0].nodeValue = "📷 ";
    }
  }

  function clearChat() {
    document.getElementById('chat').innerHTML = '';
    chatHistory = [];
  }

  async function fetchModels() {
    const baseUrl = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');
    const select = document.getElementById('modelSelect');
    const dot = document.getElementById('statusDot');
    const savedModel = localStorage.getItem('shadow_model');

    if (!baseUrl) {
      select.innerHTML = '<option value="">กรุณาใส่ URL ของ Ollama ใน ⚙️</option>';
      dot.classList.remove('online');
      return;
    }

    if (window.location.protocol === 'https:' && baseUrl.startsWith('http://')) {
      select.innerHTML = '<option value="">เว็บ https เรียก http ไม่ได้</option>';
      dot.classList.remove('online');
      return;
    }

    try {
      const res = await fetch(`${baseUrl}/api/tags`);
      const data = await res.json();
      select.innerHTML = '';

      if (data.models && data.models.length > 0) {
        data.models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.name;
          const sizeGB = (m.size / (1024 ** 3)).toFixed(1);
          opt.textContent = `${m.name} (${sizeGB} GB)`;
          select.appendChild(opt);
        });
        if (savedModel && [...select.options].some(o => o.value === savedModel)) {
          select.value = savedModel;
        }
        dot.classList.add('online');
      } else {
        select.innerHTML = '<option value="">ไม่พบโมเดลในเครื่อง</option>';
        dot.classList.remove('online');
      }
    } catch (err) {
      select.innerHTML = '<option value="">เชื่อมต่อ Ollama ไม่ได้</option>';
      dot.classList.remove('online');
    }
  }

  document.getElementById('modelSelect').addEventListener('change', (e) => {
    localStorage.setItem('shadow_model', e.target.value);
  });

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });
  }

  async function send() {
    const promptInput = document.getElementById('prompt');
    const imageInput = document.getElementById('imageInput');
    const model = document.getElementById('modelSelect').value;
    const baseUrl = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');
    const systemPrompt = document.getElementById('systemPrompt').value.trim();
    const numCtx = parseInt(document.getElementById('numCtx').value, 10) || 2048;
    const chatBox = document.getElementById('chat');

    const text = promptInput.value.trim();
    const file = imageInput.files[0];

    if (!model) return alert("กรุณาเลือกโมเดลก่อนครับ");
    if (!text && !file) return;

    const userDiv = document.createElement('div');
    userDiv.className = 'msg user';
    let base64Img = null;
    if (file) {
      base64Img = await toBase64(file);
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      userDiv.appendChild(img);
    }
    userDiv.appendChild(document.createTextNode(text));
    chatBox.appendChild(userDiv);

    promptInput.value = '';
    imageInput.value = '';
    updateFileBadge();

    const userMessage = { role: "user", content: text || "อธิบายรูปภาพนี้" };
    if (base64Img) userMessage.images = [base64Img];
    chatHistory.push(userMessage);
    if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6);

    const aiDiv = document.createElement('div');
    aiDiv.className = 'msg ai';
    aiDiv.textContent = 'S.H.A.D.O.W. กำลังประมวลผล...';
    chatBox.appendChild(aiDiv);
    chatBox.scrollTop = chatBox.scrollHeight;

    const messagesPayload = systemPrompt
      ? [{ role: "system", content: systemPrompt }, ...chatHistory]
      : chatHistory;

    try {
      const res = await fetch(`${baseUrl}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: model,
          stream: false,
          options: { num_ctx: numCtx },
          messages: messagesPayload
        })
      });
      const data = await res.json();
      const reply = data.message.content;
      aiDiv.textContent = reply;
      chatHistory.push({ role: "assistant", content: reply });
    } catch (err) {
      aiDiv.textContent = "Error: เชื่อมต่อ Ollama ไม่ได้ (เช็ก URL, OLLAMA_ORIGINS หรือ Tunnel)";
    }
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>

</body>
</html>
