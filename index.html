<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MJ Local AI</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e1e1e; padding: 12px 16px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #333; }
    select, input, button { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
    .user { background: #0066cc; align-self: flex-end; }
    .ai { background: #262626; align-self: flex-start; border: 1px solid #333; }
    .msg img { max-width: 200px; border-radius: 8px; display: block; margin-bottom: 6px; }
    footer { background: #1e1e1e; padding: 12px; display: flex; gap: 8px; border-top: 1px solid #333; }
    #prompt { flex: 1; }
    button.send { background: #0066cc; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <strong>🤖 MJ AI</strong>
  <select id="model">
    <option value="gemma4:e2b">gemma4:e2b (คุยทั่วไป + อ่านรูป)</option>
    <option value="qwen2.5-coder:7b">qwen2.5-coder:7b (เขียนโค้ด)</option>
    <option value="dolphin-llama3:8b">dolphin-llama3:8b (ไม่เซนเซอร์)</option>
  </select>
</header>

<div id="chat"></div>

<footer>
  <input type="file" id="imageInput" accept="image/*" style="width: 95px;">
  <input type="text" id="prompt" placeholder="พิมพ์ข้อความ..." onkeypress="if(event.key==='Enter') send()">
  <button class="send" onclick="send()">ส่ง</button>
</footer>

<script>
  const OLLAMA_URL = "http://192.168.1.2:11434/api/chat";
  const SYSTEM_PROMPT = "<|think|>off ตอบให้สั้น กระชับ ตรงประเด็นที่สุด ไม่ต้องอารัมภบท";

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });
  }

  async function send() {
    const promptInput = document.getElementById('prompt');
    const imageInput = document.getElementById('imageInput');
    const model = document.getElementById('model').value;
    const chatBox = document.getElementById('chat');
    const text = promptInput.value.trim();
    const file = imageInput.files[0];

    if (!text && !file) return;

    // แสดงข้อความฝั่งผู้ใช้
    const userDiv = document.createElement('div');
    userDiv.className = 'msg user';
    let base64Img = null;
    if (file) {
      base64Img = await toBase64(file);
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      userDiv.appendChild(img);
    }
    userDiv.appendChild(document.createTextNode(text));
    chatBox.appendChild(userDiv);

    promptInput.value = '';
    imageInput.value = '';

    // สร้างกล่องรอคำตอบจาก AI
    const aiDiv = document.createElement('div');
    aiDiv.className = 'msg ai';
    aiDiv.textContent = 'กำลังพิมพ์...';
    chatBox.appendChild(aiDiv);
    chatBox.scrollTop = chatBox.scrollHeight;

    const userMessage = { role: "user", content: text || "อธิบายรูปภาพนี้" };
    if (base64Img) userMessage.images = [base64Img];

    try {
      const res = await fetch(OLLAMA_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: model,
          stream: false,
          options: { num_ctx: 2048 },
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            userMessage
          ]
        })
      });
      const data = await res.json();
      aiDiv.textContent = data.message.content;
    } catch (err) {
      aiDiv.textContent = "เชื่อมต่อไม่ได้: เช็ก IP หรือการตั้งค่า OLLAMA_ORIGINS";
    }
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>

</body>
</html>
