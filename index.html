<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00a8ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>S.H.A.D.O.W. // AI Workspace</title>
  <link id="manifest-link" rel="manifest" href="">
  <style>
    :root {
      --bg-main: #090c10;
      --bg-panel: #11161d;
      --bg-card: #161c26;
      --bg-input: #1c2430;
      --accent: #00a8ff;
      --accent-soft: rgba(0, 168, 255, 0.14);
      --accent-hover: #0088d1;
      --text-main: #e6edf5;
      --text-dim: #8b98ad;
      --border: #263142;
      --success: #2ed573;
      --danger: #ff4757;
      --warn: #ffa502;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      background: var(--bg-panel);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 8px;
      flex-wrap: wrap;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      letter-spacing: 1.4px;
      color: var(--accent);
      font-size: 15px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--danger);
      display: inline-block;
    }
    .status-dot.online {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    select, input, textarea, button {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--accent); }
    select { max-width: 190px; cursor: pointer; }
    button { cursor: pointer; transition: 0.15s; display: inline-flex; align-items: center; gap: 5px; }
    button:hover { background: #242f3f; }
    button.primary {
      background: var(--accent);
      color: #041018;
      font-weight: 700;
      border: none;
    }
    button.primary:hover { background: var(--accent-hover); color: #fff; }
    button.toggle-on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }
    button.install-btn {
      background: rgba(46, 213, 115, 0.14);
      border-color: rgba(46, 213, 115, 0.45);
      color: var(--success);
      font-weight: 600;
    }

    #settingsPanel {
      display: none;
      background: var(--bg-panel);
      padding: 14px;
      border-bottom: 1px solid var(--border);
      flex-direction: column;
      gap: 10px;
      max-height: 55vh;
      overflow-y: auto;
    }
    #settingsPanel.open { display: flex; }
    .setting-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 760px) { .setting-grid { grid-template-columns: 1fr; } }
    .setting-row { display: flex; flex-direction: column; gap: 5px; }
    .setting-row label { font-size: 11px; color: var(--text-dim); font-weight: 700; letter-spacing: 0.4px; }
    textarea { resize: vertical; min-height: 64px; font-family: inherit; }

    #attachmentsBar {
      display: none;
      background: var(--bg-panel);
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    #attachmentsBar.has-items { display: flex; }
    .chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip button {
      background: transparent;
      border: none;
      padding: 0 2px;
      color: var(--text-dim);
      font-size: 14px;
    }
    .chip button:hover { color: var(--danger); }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 86%;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.55;
      word-wrap: break-word;
      font-size: 14px;
    }
    .user {
      background: #005885;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
      white-space: pre-wrap;
    }
    .ai {
      background: var(--bg-panel);
      align-self: flex-start;
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }
    .ai-body { white-space: pre-wrap; }

    details.think-box {
      background: rgba(0, 168, 255, 0.06);
      border: 1px solid rgba(0, 168, 255, 0.25);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 12.5px;
      color: var(--text-dim);
    }
    details.think-box summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--accent);
      user-select: none;
    }
    details.think-box pre {
      margin: 8px 0 0;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .artifact-card {
      margin-top: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .artifact-head {
      background: var(--bg-input);
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      border-bottom: 1px solid var(--border);
    }
    .artifact-editor {
      width: 100%;
      min-height: 150px;
      border: none;
      border-radius: 0;
      background: #0c1016;
      color: #d8e3f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      padding: 10px;
    }
    .gen-img-wrap {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .gen-img-wrap img, .msg img {
      max-width: 280px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.16);
      display: block;
    }

    .mode-strip {
      background: var(--bg-panel);
      padding: 6px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      overflow-x: auto;
      align-items: center;
    }
    .mode-pill {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .mode-pill.active {
      background: var(--accent);
      color: #041018;
      border-color: var(--accent);
      font-weight: 700;
    }

    footer {
      background: var(--bg-panel);
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      align-items: center;
    }
    .file-btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .file-btn input[type=file] {
      position: absolute;
      left: 0; top: 0; opacity: 0;
      width: 100%; height: 100%; cursor: pointer;
    }
    #prompt { flex: 1; min-width: 0; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <span id="statusDot" class="status-dot" title="สถานะการเชื่อมต่อ"></span>
    <span>S.H.A.D.O.W.</span>
  </div>

  <div class="controls">
    <button id="installBtn" class="install-btn" style="display:none;" onclick="installPWA()">⬇ ติดตั้งแอป</button>
    <button id="thinkToggleBtn" class="toggle-on" onclick="toggleThinking()" title="เปิด/ปิด โหมดใช้ความคิด">🧠 คิด: เปิด</button>
    <select id="modelSelect" title="เลือกโมเดล">
      <option value="">กำลังโหลดโมเดล...</option>
    </select>
    <button onclick="fetchModels()" title="รีเฟรชโมเดล">↻</button>
    <button onclick="toggleSettings()" title="ตั้งค่า">⚙️</button>
    <button onclick="clearChat()" title="ล้างแชต">🗑️</button>
  </div>
</header>

<div id="settingsPanel">
  <div class="setting-grid">
    <div class="setting-row">
      <label>OLLAMA / CHAT URL (https://...)</label>
      <input type="text" id="serverUrl" placeholder="https://xxxx.trycloudflare.com">
    </div>
    <div class="setting-row">
      <label>IMAGE GEN ENDPOINT (ถ้ามี API/โมเดลสร้างรูป)</label>
      <input type="text" id="imageApiUrl" placeholder="เว้นว่าง = สร้างภาพกราฟิก/ไดอะแกรมผ่าน Canvas">
    </div>
    <div class="setting-row">
      <label>NUM_CTX</label>
      <input type="number" id="numCtx" value="4096">
    </div>
  </div>
  <div class="setting-row">
    <label>SYSTEM PROMPT</label>
    <textarea id="systemPrompt">คุณคือ S.H.A.D.O.W. ผู้ช่วย AI ส่วนตัวของ MJ ตอบตรงไปตรงมา กระชับ ทำงานแม่นยำ เมื่อถูกขอให้สร้างหรือแก้ไขไฟล์งาน ให้ส่งโค้ด/เนื้อหาไฟล์พร้อมระบุชื่อไฟล์ให้ชัดเจน</textarea>
  </div>
  <div style="display:flex; justify-content:flex-end; gap:8px;">
    <button class="primary" onclick="saveSettings()">บันทึกการตั้งค่า</button>
  </div>
</div>

<div id="attachmentsBar"></div>

<div id="chat"></div>

<div class="mode-strip">
  <span style="font-size:11px; color:var(--text-dim);">โหมดงาน:</span>
  <button class="mode-pill active" data-mode="chat" onclick="setWorkMode('chat')">💬 แชต / วิเคราะห์</button>
  <button class="mode-pill" data-mode="file" onclick="setWorkMode('file')">📄 สร้าง / แก้ไขไฟล์</button>
  <button class="mode-pill" data-mode="image" onclick="setWorkMode('image')">🎨 เจนรูปภาพ</button>
</div>

<footer>
  <label class="file-btn" title="แนบไฟล์งาน (โค้ด, txt, csv, json, md, รูปภาพ ฯลฯ)">
    📎 ไฟล์
    <input type="file" id="docInput" multiple accept="image/*,.txt,.md,.csv,.json,.js,.ts,.html,.css,.py,.java,.cpp,.c,.sql,.xml,.yaml,.yml,.log" onchange="handleFiles(this.files)">
  </label>
  <input type="text" id="prompt" placeholder="พิมพ์คำสั่งให้ S.H.A.D.O.W. ..." onkeypress="if(event.key==='Enter') send()">
  <button class="primary" onclick="send()">ส่ง</button>
</footer>

<script>
  let chatHistory = [];
  let attachedFiles = []; // { name, type, isImage, base64, textContent, previewUrl }
  let thinkEnabled = true;
  let workMode = 'chat';
  let deferredPrompt = null;

  // ตั้งค่า PWA Manifest แบบฝังตัวเพื่อให้ติดตั้งลงเครื่องได้ทันที
  (function setupPWA() {
    const manifest = {
      name: "S.H.A.D.O.W. AI Workspace",
      short_name: "S.H.A.D.O.W.",
      start_url: ".",
      display: "standalone",
      background_color: "#090c10",
      theme_color: "#00a8ff",
      icons: [
        {
          src: "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="26" fill="#0d131c"/><circle cx="64" cy="64" r="34" fill="none" stroke="#00a8ff" stroke-width="8"/><circle cx="64" cy="64" r="12" fill="#00a8ff"/></svg>'),
          sizes: "128x128",
          type: "image/svg+xml"
        }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
    document.getElementById("manifest-link").href = URL.createObjectURL(blob);

    if ("serviceWorker" in navigator) {
      const swCode = `
        self.addEventListener("install", e => self.skipWaiting());
        self.addEventListener("activate", e => e.waitUntil(self.clients.claim()));
        self.addEventListener("fetch", e => {});
      `;
      const swBlob = new Blob([swCode], { type: "application/javascript" });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }
  })();

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("installBtn").style.display = "inline-flex";
  });

  async function installPWA() {
    if (!deferredPrompt) {
      alert("หากไม่เด้งหน้าต่างติดตั้งอัตโนมัติ ให้กดเมนูเบราว์เซอร์ (⋮ หรือ Share) แล้วเลือก 'Add to Home Screen' หรือ 'Install App'");
      return;
    }
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById("installBtn").style.display = "none";
  }

  window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    const qUrl = params.get("url");
    if (qUrl) {
      localStorage.setItem("shadow_url", qUrl.trim());
    }
    if (localStorage.getItem("shadow_url")) {
      document.getElementById("serverUrl").value = localStorage.getItem("shadow_url");
    }
    if (localStorage.getItem("shadow_img_api")) {
      document.getElementById("imageApiUrl").value = localStorage.getItem("shadow_img_api");
    }
    if (localStorage.getItem("shadow_ctx")) {
      document.getElementById("numCtx").value = localStorage.getItem("shadow_ctx");
    }
    if (localStorage.getItem("shadow_sys")) {
      document.getElementById("systemPrompt").value = localStorage.getItem("shadow_sys");
    }
    if (localStorage.getItem("shadow_think") !== null) {
      thinkEnabled = localStorage.getItem("shadow_think") === "true";
      renderThinkButton();
    }
    fetchModels();
  };

  function toggleThinking() {
    thinkEnabled = !thinkEnabled;
    localStorage.setItem("shadow_think", String(thinkEnabled));
    renderThinkButton();
  }

  function renderThinkButton() {
    const btn = document.getElementById("thinkToggleBtn");
    btn.textContent = thinkEnabled ? "🧠 คิด: เปิด" : "⚡ คิด: ปิด";
    btn.classList.toggle("toggle-on", thinkEnabled);
  }

  function setWorkMode(mode) {
    workMode = mode;
    document.querySelectorAll(".mode-pill").forEach(el => {
      el.classList.toggle("active", el.dataset.mode === mode);
    });
    const promptEl = document.getElementById("prompt");
    if (mode === "file") {
      promptEl.placeholder = "สั่งสร้างไฟล์ใหม่ หรือสั่งแก้ไขไฟล์ที่แนบไว้ เช่น 'แก้โค้ดให้รองรับ dark mode แล้วตั้งชื่อ app.js'...";
    } else if (mode === "image") {
      promptEl.placeholder = "อธิบายรูปภาพที่ต้องการให้เจน เช่น 'ภาพโลโก้ไซเบอร์พังก์สีฟ้าเข้มบนพื้นหลังมืด'...";
    } else {
      promptEl.placeholder = "พิมพ์คำสั่งหรือให้ช่วยวิเคราะห์ไฟล์ที่แนบมา...";
    }
  }

  function toggleSettings() {
    document.getElementById("settingsPanel").classList.toggle("open");
  }

  function saveSettings() {
    const cleanUrl = document.getElementById("serverUrl").value.trim().replace(/\/$/, "");
    const cleanImgUrl = document.getElementById("imageApiUrl").value.trim().replace(/\/$/, "");
    document.getElementById("serverUrl").value = cleanUrl;
    document.getElementById("imageApiUrl").value = cleanImgUrl;

    localStorage.setItem("shadow_url", cleanUrl);
    localStorage.setItem("shadow_img_api", cleanImgUrl);
    localStorage.setItem("shadow_ctx", document.getElementById("numCtx").value);
    localStorage.setItem("shadow_sys", document.getElementById("systemPrompt").value);
    toggleSettings();
    fetchModels();
  }

  async function handleFiles(fileList) {
    for (const file of Array.from(fileList)) {
      const isImage = file.type.startsWith("image/");
      if (isImage) {
        const base64 = await readAsBase64(file);
        attachedFiles.push({
          name: file.name,
          type: file.type,
          isImage: true,
          base64,
          previewUrl: URL.createObjectURL(file)
        });
      } else {
        const textContent = await readAsText(file);
        attachedFiles.push({
          name: file.name,
          type: file.type || "text/plain",
          isImage: false,
          textContent: textContent.slice(0, 60000)
        });
      }
    }
    document.getElementById("docInput").value = "";
    renderAttachments();
  }

  function removeAttachment(idx) {
    attachedFiles.splice(idx, 1);
    renderAttachments();
  }

  function renderAttachments() {
    const bar = document.getElementById("attachmentsBar");
    bar.innerHTML = "";
    if (attachedFiles.length === 0) {
      bar.classList.remove("has-items");
      return;
    }
    bar.classList.add("has-items");
    attachedFiles.forEach((f, idx) => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.innerHTML = `<span>${f.isImage ? "🖼️" : "📄"} ${escapeHtml(f.name)}</span><button onclick="removeAttachment(${idx})" title="ลบไฟล์">×</button>`;
      bar.appendChild(chip);
    });
  }

  function readAsBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(",")[1]);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  function readAsText(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsText(file);
    });
  }

  function clearChat() {
    document.getElementById("chat").innerHTML = "";
    chatHistory = [];
  }

  async function fetchModels() {
    const baseUrl = document.getElementById("serverUrl").value.trim().replace(/\/$/, "");
    const select = document.getElementById("modelSelect");
    const dot = document.getElementById("statusDot");
    const savedModel = localStorage.getItem("shadow_model");

    if (!baseUrl) {
      select.innerHTML = '<option value="">ตั้งค่า URL ใน ⚙️</option>';
      dot.classList.remove("online");
      return;
    }

    try {
      const res = await fetch(`${baseUrl}/api/tags`);
      const data = await res.json();
      select.innerHTML = "";
      if (data.models && data.models.length > 0) {
        data.models.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m.name;
          const gb = (m.size / (1024 ** 3)).toFixed(1);
          opt.textContent = `${m.name} (${gb} GB)`;
          select.appendChild(opt);
        });
        if (savedModel && [...select.options].some(o => o.value === savedModel)) {
          select.value = savedModel;
        }
        dot.classList.add("online");
      } else {
        select.innerHTML = '<option value="">ไม่พบโมเดล</option>';
        dot.classList.remove("online");
      }
    } catch (e) {
      select.innerHTML = '<option value="">เชื่อมต่อไม่ได้</option>';
      dot.classList.remove("online");
    }
  }

  document.getElementById("modelSelect").addEventListener("change", (e) => {
    localStorage.setItem("shadow_model", e.target.value);
  });

  function parseThinkAndContent(raw) {
    let thinkPart = "";
    let cleanPart = raw || "";

    const thinkMatch = cleanPart.match(/<think>([\s\S]*?)<\/think>/i);
    if (thinkMatch) {
      thinkPart = thinkMatch[1].trim();
      cleanPart = cleanPart.replace(/<think>[\s\S]*?<\/think>/gi, "").trim();
    }

    if (!thinkEnabled) {
      thinkPart = "";
      cleanPart = cleanPart.replace(/<think>[\s\S]*$/gi, "").trim();
    }

    return { thinkPart, cleanPart };
  }

  function extractFileBlocks(text, fallbackPrompt) {
    const blocks = [];
    const regex = /```([a-zA-Z0-9_-]*)(?::([^\n]+))?\n([\s\S]*?)```/g;
    let match;
    let index = 1;
    while ((match = regex.exec(text)) !== null) {
      const lang = (match[1] || "txt").toLowerCase();
      const explicitName = match[2] ? match[2].trim() : "";
      const extMap = {
        javascript: "js", js: "js", typescript: "ts", ts: "ts",
        html: "html", css: "css", python: "py", py: "py",
        json: "json", markdown: "md", md: "md", csv: "csv",
        sql: "sql", sh: "sh", bash: "sh", xml: "xml", yaml: "yml"
      };
      const ext = extMap[lang] || lang || "txt";
      const fileName = explicitName || `shadow-output-${index}.${ext}`;
      blocks.push({ fileName, content: match[3] });
      index++;
    }
    return blocks;
  }

  function downloadTextFile(filename, content) {
    const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&")
      .replace(/</g, "<")
      .replace(/>/g, ">")
      .replace(/"/g, """);
  }

  async function generateImageForUser(promptText, aiDiv) {
    const imgApi = document.getElementById("imageApiUrl").value.trim().replace(/\/$/, "");
    const chatBox = document.getElementById("chat");

    if (imgApi) {
      try {
        const res = await fetch(`${imgApi}/api/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: promptText, stream: false })
        });
        const data = await res.json();
        const b64 = data.image || (data.images && data.images[0]);
        if (b64) {
          const src = b64.startsWith("data:") ? b64 : `data:image/png;base64,${b64}`;
          renderGeneratedImage(aiDiv, src, "generated-image.png", promptText);
          return;
        }
      } catch (e) {}
    }

    // สร้างภาพกราฟิก/โปสเตอร์/ไดอะแกรมผ่าน HTML5 Canvas กรณีไม่ได้ต่อ Image API แยก
    const canvas = document.createElement("canvas");
    canvas.width = 768;
    canvas.height = 512;
    const ctx = canvas.getContext("2d");

    const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    grad.addColorStop(0, "#09111e");
    grad.addColorStop(0.5, "#0f2942");
    grad.addColorStop(1, "#071324");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(0, 168, 255, 0.22)";
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 32) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 32) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    ctx.strokeStyle = "#00a8ff";
    ctx.lineWidth = 3;
    ctx.strokeRect(28, 28, canvas.width - 56, canvas.height - 56);

    ctx.fillStyle = "#00a8ff";
    ctx.font = "bold 26px sans-serif";
    ctx.fillText("S.H.A.D.O.W. // VISUAL RENDER", 56, 82);

    ctx.fillStyle = "#e6edf5";
    ctx.font = "600 22px sans-serif";
    wrapCanvasText(ctx, promptText, 56, 140, canvas.width - 112, 34);

    const dataUrl = canvas.toDataURL("image/png");
    renderGeneratedImage(aiDiv, dataUrl, "shadow-visual.png", promptText);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(" ");
    let line = "";
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + " ";
      if (ctx.measureText(testLine).width > maxWidth && n > 0) {
        ctx.fillText(line.trim(), x, y);
        line = words[n] + " ";
        y += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line.trim(), x, y);
  }

  function renderGeneratedImage(aiDiv, src, filename, caption) {
    aiDiv.innerHTML = `<div class="ai-body">สร้างภาพเสร็จแล้ว: ${escapeHtml(caption)}</div>`;
    const wrap = document.createElement("div");
    wrap.className = "gen-img-wrap";

    const img = document.createElement("img");
    img.src = src;
    wrap.appendChild(img);

    const dlBtn = document.createElement("button");
    dlBtn.className = "primary";
    dlBtn.style.alignSelf = "flex-start";
    dlBtn.textContent = "⬇ ดาวน์โหลดรูปภาพ";
    dlBtn.onclick = () => {
      const a = document.createElement("a");
      a.href = src;
      a.download = filename;
      a.click();
    };
    wrap.appendChild(dlBtn);
    aiDiv.appendChild(wrap);
  }

  async function send() {
    const promptInput = document.getElementById("prompt");
    const model = document.getElementById("modelSelect").value;
    const baseUrl = document.getElementById("serverUrl").value.trim().replace(/\/$/, "");
    const numCtx = parseInt(document.getElementById("numCtx").value, 10) || 4096;
    let sysPrompt = document.getElementById("systemPrompt").value.trim();
    const chatBox = document.getElementById("chat");

    const text = promptInput.value.trim();
    const filesSnapshot = [...attachedFiles];

    if (!text && filesSnapshot.length === 0) return;

    const userDiv = document.createElement("div");
    userDiv.className = "msg user";
    filesSnapshot.forEach(f => {
      if (f.isImage && f.previewUrl) {
        const img = document.createElement("img");
        img.src = f.previewUrl;
        userDiv.appendChild(img);
      }
    });
    const fileNote = filesSnapshot.length > 0
      ? `\n[แนบไฟล์: ${filesSnapshot.map(f => f.name).join(", ")}]`
      : "";
    userDiv.appendChild(document.createTextNode((text || "ช่วยวิเคราะห์ไฟล์นี้") + fileNote));
    chatBox.appendChild(userDiv);

    promptInput.value = "";
    attachedFiles = [];
    renderAttachments();
    chatBox.scrollTop = chatBox.scrollHeight;

    const aiDiv = document.createElement("div");
    aiDiv.className = "msg ai";
    aiDiv.innerHTML = `<div class="ai-body">S.H.A.D.O.W. กำลังทำงาน...</div>`;
    chatBox.appendChild(aiDiv);
    chatBox.scrollTop = chatBox.scrollHeight;

    if (workMode === "image") {
      await generateImageForUser(text || "S.H.A.D.O.W. AI Concept", aiDiv);
      return;
    }

    if (!model) {
      aiDiv.innerHTML = `<div class="ai-body">กรุณาเลือกโมเดลก่อนครับ (หรือตั้งค่า URL ใน ⚙️)</div>`;
      return;
    }

    const docContext = filesSnapshot
      .filter(f => !f.isImage)
      .map(f => `\n--- ไฟล์: ${f.name} ---\n${f.textContent}\n--- จบไฟล์ ${f.name} ---`)
      .join("\n");

    const imageList = filesSnapshot.filter(f => f.isImage).map(f => f.base64);

    let effectivePrompt = text || "ช่วยวิเคราะห์ไฟล์ที่แนบมาให้ละเอียด";
    if (docContext) {
      effectivePrompt += `\n\nข้อมูลจากไฟล์ที่แนบมา:${docContext}`;
    }
    if (workMode === "file") {
      effectivePrompt += `\n\n[คำสั่งพิเศษ: ให้สร้างหรือแก้ไขไฟล์ตามคำขอ โดยใส่เนื้อหาไฟล์ไว้ในโค้ดบล็อก \`\`\`นามสกุล:ชื่อไฟล์.นามสกุล ... \`\`\` เพื่อให้ผู้ใช้แก้ไขและดาวน์โหลดไฟล์ได้ทันที]`;
    }
    if (!thinkEnabled) {
      effectivePrompt = `/no_think ${effectivePrompt}`;
      sysPrompt = `${sysPrompt} ห้ามแสดงขั้นตอนความคิด ให้ตอบผลลัพธ์สุดท้ายทันที`;
    } else {
      sysPrompt = `${sysPrompt} หากต้องใช้ความคิดวิเคราะห์ ให้ใส่ส่วนวิเคราะห์ไว้ใน <think>...</think> แล้วตามด้วยคำตอบ`;
    }

    const msgObj = { role: "user", content: effectivePrompt };
    if (imageList.length > 0) msgObj.images = imageList;
    chatHistory.push(msgObj);
    if (chatHistory.length > 8) chatHistory = chatHistory.slice(-8);

    const payloadMessages = sysPrompt
      ? [{ role: "system", content: sysPrompt }, ...chatHistory]
      : chatHistory;

    try {
      const res = await fetch(`${baseUrl}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model,
          stream: false,
          options: { num_ctx: numCtx },
          messages: payloadMessages
        })
      });
      const data = await res.json();
      const fullReply = (data.message && data.message.content) || "";
      const { thinkPart, cleanPart } = parseThinkAndContent(fullReply);

      aiDiv.innerHTML = "";
      if (thinkEnabled && thinkPart) {
        const det = document.createElement("details");
        det.className = "think-box";
        det.innerHTML = `<summary>🧠 กระบวนการคิดของ S.H.A.D.O.W.</summary><pre>${escapeHtml(thinkPart)}</pre>`;
        aiDiv.appendChild(det);
      }

      const bodyDiv = document.createElement("div");
      bodyDiv.className = "ai-body";
      bodyDiv.textContent = cleanPart || fullReply;
      aiDiv.appendChild(bodyDiv);

      const fileBlocks = extractFileBlocks(cleanPart || fullReply, text);
      fileBlocks.forEach(fb => {
        const card = document.createElement("div");
        card.className = "artifact-card";

        const head = document.createElement("div");
        head.className = "artifact-head";

        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.value = fb.fileName;
        nameInput.style.padding = "4px 8px";
        nameInput.style.fontSize = "12px";
        nameInput.style.maxWidth = "220px";

        const dlBtn = document.createElement("button");
        dlBtn.className = "primary";
        dlBtn.style.padding = "5px 10px";
        dlBtn.style.fontSize = "12px";
        dlBtn.textContent = "⬇ ดาวน์โหลดไฟล์";

        const editor = document.createElement("textarea");
        editor.className = "artifact-editor";
        editor.value = fb.content;

        dlBtn.onclick = () => downloadTextFile(nameInput.value.trim() || "file.txt", editor.value);

        head.appendChild(nameInput);
        head.appendChild(dlBtn);
        card.appendChild(head);
        card.appendChild(editor);
        aiDiv.appendChild(card);
      });

      chatHistory.push({ role: "assistant", content: fullReply });
    } catch (err) {
      aiDiv.innerHTML = `<div class="ai-body">Error: เชื่อมต่อไม่ได้ (เช็ก URL ของ Ollama หรือสถานะ Tunnel)</div>`;
    }
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>
