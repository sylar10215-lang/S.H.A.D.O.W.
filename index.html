<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#00a8ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="S.H.A.D.O.W.">
  <title>S.H.A.D.O.W.</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg: #090c10;
      --panel: #11161d;
      --card: #161c26;
      --input: #1c2430;
      --accent: #00a8ff;
      --text: #e6edf5;
      --dim: #8b98ad;
      --border: #263142;
      --ok: #2ed573;
      --err: #ff4757;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1px;
      font-size: 16px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--err);
      display: inline-block;
    }
    .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    /* ขนาดฟอนต์ 16px กันมือถือซูมเข้าเองเวลาโฟกัสช่องพิมพ์ */
    select, input, textarea, button {
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 16px;
      outline: none;
      touch-action: manipulation;
    }
    header select, header button, .tools button {
      font-size: 13px;
      padding: 7px 10px;
    }
    select { max-width: 165px; }
    button { cursor: pointer; }
    button:hover { background: #243040; }
    .primary { background: var(--accent); color: #05111a; font-weight: 700; border: none; }
    .active-mode { border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .install-btn {
      background: rgba(46, 213, 115, 0.15);
      border-color: rgba(46, 213, 115, 0.45);
      color: var(--ok);
      font-weight: 700;
    }

    .drawer {
      display: none;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px;
      flex-direction: column;
      gap: 8px;
      max-height: 55vh;
      overflow-y: auto;
    }
    .drawer.show { display: flex; }
    .row { display: flex; flex-direction: column; gap: 4px; }
    .row label { font-size: 11px; color: var(--dim); font-weight: 700; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (max-width: 720px) { .grid3 { grid-template-columns: 1fr; } }
    textarea { min-height: 60px; resize: vertical; font-family: inherit; }

    .mem-list { display: flex; flex-direction: column; gap: 6px; }
    .mem-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    #filesBar {
      display: none;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      gap: 6px;
      flex-wrap: wrap;
    }
    #filesBar.show { display: flex; }
    .tag {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 13px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user { background: #005885; color: #fff; align-self: flex-end; }
    .ai { background: var(--panel); border: 1px solid var(--border); align-self: flex-start; }
    details.think {
      background: rgba(0,168,255,0.07);
      border: 1px solid rgba(0,168,255,0.25);
      border-radius: 8px;
      padding: 6px 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--dim);
    }
    .file-box {
      margin-top: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
    }
    .file-box textarea {
      width: 100%;
      min-height: 130px;
      margin-top: 6px;
      background: #0b0f15;
      font-family: monospace;
      font-size: 13px;
    }
    .msg img {
      max-width: 260px;
      border-radius: 8px;
      margin-bottom: 6px;
      display: block;
      border: 1px solid rgba(255,255,255,0.14);
    }

    /* ดันแถบเมนูล่างสุดขึ้นมาให้มีระยะหายใจ ไม่ติดขอบจอเกินไป */
    .bottom-dock {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding-bottom: calc(14px + var(--safe-bottom));
    }
    .tools {
      padding: 8px 12px 4px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    footer {
      padding: 8px 12px 4px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .upload {
      position: relative;
      overflow: hidden;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    #prompt { flex: 1; min-width: 0; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <span id="dot" class="dot"></span>
    <span>S.H.A.D.O.W.</span>
  </div>
  <div class="bar">
    <button id="installBtn" class="install-btn" type="button" style="display:none;" onclick="installApp()">⬇ ติดตั้งแอป</button>
    <button id="thinkBtn" class="active-mode" type="button" onclick="toggleThink()">🧠 คิด: เปิด</button>
    <button type="button" onclick="toggleDrawer('memoryBox')">🗂️ ความจำ (<span id="memCount">0</span>)</button>
    <select id="models"><option value="">โมเดล...</option></select>
    <button type="button" onclick="loadModels()">↻</button>
    <button type="button" onclick="toggleDrawer('settings')">⚙️</button>
    <button type="button" onclick="clearChat()">🗑️</button>
  </div>
</header>

<div id="memoryBox" class="drawer">
  <div class="row">
    <label>เพิ่มความจำหรือข้อมูลสำคัญให้ AI หยิบไปใช้เสมอ</label>
    <div style="display:flex; gap:8px;">
      <input id="newMemInput" type="text" style="flex:1;" placeholder="เช่น ชอบใช้ Python และทำงานกับไฟล์ CSV..." onkeydown="if(event.key==='Enter') addManualMemory()">
      <button class="primary" type="button" onclick="addManualMemory()">+ บันทึก</button>
    </div>
  </div>
  <div class="row">
    <label>คลังข้อมูล / โน้ตถาวร (AI จะอ่านข้อมูลนี้ประกอบคำตอบเสมอ)</label>
    <textarea id="knowledgeInput" placeholder="วางข้อมูลอ้างอิง กฎการทำงาน หรือรายละเอียดโปรเจกต์ที่อยากให้ AI หยิบใช้ตลอด..."></textarea>
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:4px;">
      <button class="primary" type="button" onclick="saveKnowledge()">บันทึกคลังข้อมูล</button>
    </div>
  </div>
  <div class="row">
    <label>รายการความจำที่บันทึกไว้</label>
    <div id="memList" class="mem-list"></div>
  </div>
</div>

<div id="settings" class="drawer">
  <div class="grid3">
    <div class="row">
      <label>OLLAMA URL (https://...)</label>
      <input id="urlInput" type="text" placeholder="https://xxxx.trycloudflare.com">
    </div>
    <div class="row">
      <label>IMAGE API URL (ถ้ามี API เจนรูป)</label>
      <input id="imgApiInput" type="text" placeholder="เว้นว่าง = สร้างภาพกราฟิกในเครื่อง">
    </div>
    <div class="row">
      <label>NUM_CTX</label>
      <input id="ctxInput" type="number" value="4096">
    </div>
  </div>
  <div class="row">
    <label>SYSTEM PROMPT</label>
    <textarea id="sysInput">คุณคือ S.H.A.D.O.W. ผู้ช่วยของ MJ ตอบตรงไปตรงมา กระชับ หากสร้างหรือแก้ไขไฟล์ให้ใส่โค้ดบล็อกพร้อมชื่อไฟล์ เช่น ```js:app.js```</textarea>
  </div>
  <div style="display:flex; justify-content:flex-end; gap:8px;">
    <button type="button" onclick="toggleDrawer('settings')">ปิด</button>
    <button class="primary" type="button" onclick="saveCfg()">บันทึก</button>
  </div>
</div>

<div id="filesBar"></div>
<div id="chat"></div>

<div class="bottom-dock">
  <div class="tools">
    <button id="m-chat" class="active-mode" type="button" onclick="setMode('chat')">💬 วิเคราะห์/แชต</button>
    <button id="m-file" type="button" onclick="setMode('file')">📄 สร้าง/แก้ไฟล์</button>
    <button id="m-img" type="button" onclick="setMode('image')">🎨 เจนรูปภาพ</button>
  </div>

  <footer>
    <label class="upload">
      📎 ไฟล์
      <input type="file" multiple accept="image/*,.txt,.md,.csv,.json,.js,.ts,.html,.css,.py,.sql,.log" onchange="addFiles(this.files)">
    </label>
    <input id="prompt" type="text" placeholder="พิมพ์คำสั่ง หรือ 'จำไว้นะว่า...'" onkeydown="if(event.key==='Enter') send()">
    <button class="primary" type="button" onclick="send()">ส่ง</button>
  </footer>
</div>

<script>
  let thinkOn = true;
  let mode = "chat";
  let files = [];
  let history = [];
  let memories = [];
  let installPromptEvent = null;

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    installPromptEvent = e;
    document.getElementById("installBtn").style.display = "inline-block";
  });

  async function installApp() {
    if (!installPromptEvent) return;
    installPromptEvent.prompt();
    await installPromptEvent.userChoice;
    installPromptEvent = null;
    document.getElementById("installBtn").style.display = "none";
  }

  function toggleDrawer(id) {
    const target = document.getElementById(id);
    const willOpen = !target.classList.contains("show");
    document.querySelectorAll(".drawer").forEach(d => d.classList.remove("show"));
    if (willOpen) target.classList.add("show");
  }

  function renderMemories() {
    localStorage.setItem("shadow_memories", JSON.stringify(memories));
    document.getElementById("memCount").textContent = String(memories.length);
    const box = document.getElementById("memList");
    box.innerHTML = "";
    if (memories.length === 0) {
      box.innerHTML = '<div style="color:var(--dim); font-size:12px;">ยังไม่มีความจำที่บันทึกไว้</div>';
      return;
    }
    memories.forEach((item, idx) => {
      const row = document.createElement("div");
      row.className = "mem-item";
      const span = document.createElement("span");
      span.textContent = "• " + item;
      const del = document.createElement("button");
      del.type = "button";
      del.textContent = "ลบ";
      del.onclick = () => {
        memories.splice(idx, 1);
        renderMemories();
      };
      row.appendChild(span);
      row.appendChild(del);
      box.appendChild(row);
    });
  }

  function addManualMemory() {
    const inp = document.getElementById("newMemInput");
    const val = inp.value.trim();
    if (!val) return;
    memories.push(val);
    inp.value = "";
    renderMemories();
  }

  function saveKnowledge() {
    localStorage.setItem("shadow_knowledge", document.getElementById("knowledgeInput").value);
    toggleDrawer("memoryBox");
  }

  function extractRememberCommand(rawText) {
    const match = rawText.match(/^(?:จำไว้นะ(?:ว่า)?|จำว่า|ช่วยจำว่า|บันทึก(?:ไว้นะ)?(?:ว่า)?|remember(?:\s+that)?[:\s]+)\s*(.+)$/i);
    if (!match) return null;
    return match[1].trim();
  }

  function toggleThink() {
    thinkOn = !thinkOn;
    const b = document.getElementById("thinkBtn");
    b.textContent = thinkOn ? "🧠 คิด: เปิด" : "⚡ คิด: ปิด";
    b.classList.toggle("active-mode", thinkOn);
  }

  function setMode(m) {
    mode = m;
    ["chat", "file", "image"].forEach(x => {
      document.getElementById("m-" + x).classList.toggle("active-mode", x === m);
    });
  }

  function saveCfg() {
    const url = document.getElementById("urlInput").value.trim().replace(/\/$/, "");
    const imgApi = document.getElementById("imgApiInput").value.trim().replace(/\/$/, "");
    document.getElementById("urlInput").value = url;
    document.getElementById("imgApiInput").value = imgApi;
    localStorage.setItem("shadow_url", url);
    localStorage.setItem("shadow_img_api", imgApi);
    localStorage.setItem("shadow_ctx", document.getElementById("ctxInput").value);
    localStorage.setItem("shadow_sys", document.getElementById("sysInput").value);
    toggleDrawer("settings");
    loadModels();
  }

  function clearChat() {
    document.getElementById("chat").innerHTML = "";
    history = [];
  }

  async function addFiles(list) {
    for (const f of Array.from(list)) {
      if (f.type.startsWith("image/")) {
        const b64 = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result.split(",")[1]);
          r.onerror = rej;
          r.readAsDataURL(f);
        });
        files.push({ name: f.name, isImg: true, b64, url: URL.createObjectURL(f) });
      } else {
        const txt = await f.text();
        files.push({ name: f.name, isImg: false, text: txt.slice(0, 50000) });
      }
    }
    renderFiles();
  }

  function renderFiles() {
    const bar = document.getElementById("filesBar");
    bar.innerHTML = "";
    bar.classList.toggle("show", files.length > 0);
    files.forEach((f, i) => {
      const span = document.createElement("span");
      span.className = "tag";
      span.textContent = (f.isImg ? "🖼️ " : "📄 ") + f.name + " ";
      const del = document.createElement("button");
      del.type = "button";
      del.textContent = "×";
      del.onclick = () => { files.splice(i, 1); renderFiles(); };
      span.appendChild(del);
      bar.appendChild(span);
    });
  }

  async function loadModels() {
    const url = document.getElementById("urlInput").value.trim().replace(/\/$/, "");
    const sel = document.getElementById("models");
    const dot = document.getElementById("dot");
    if (!url) { dot.classList.remove("on"); return; }
    try {
      const r = await fetch(url + "/api/tags");
      const d = await r.json();
      sel.innerHTML = "";
      (d.models || []).forEach(m => {
        const o = document.createElement("option");
        o.value = m.name;
        o.textContent = m.name;
        sel.appendChild(o);
      });
      dot.classList.toggle("on", (d.models || []).length > 0);
    } catch {
      dot.classList.remove("on");
    }
  }

  async function buildImageOutput(promptText) {
    const imgApi = document.getElementById("imgApiInput").value.trim().replace(/\/$/, "");
    if (imgApi) {
      try {
        const r = await fetch(imgApi + "/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: promptText, stream: false })
        });
        const d = await r.json();
        const rawB64 = d.image || (d.images && d.images[0]);
        if (rawB64) {
          return rawB64.startsWith("data:") ? rawB64 : "data:image/png;base64," + rawB64;
        }
      } catch {}
    }

    const c = document.createElement("canvas");
    c.width = 768; c.height = 480;
    const ctx = c.getContext("2d");
    const g = ctx.createLinearGradient(0, 0, 768, 480);
    g.addColorStop(0, "#08101c");
    g.addColorStop(1, "#0f2744");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 768, 480);

    ctx.strokeStyle = "#00a8ff";
    ctx.lineWidth = 3;
    ctx.strokeRect(24, 24, 720, 432);

    ctx.fillStyle = "#00a8ff";
    ctx.font = "bold 24px sans-serif";
    ctx.fillText("S.H.A.D.O.W. // IMAGE STUDIO", 48, 72);

    ctx.fillStyle = "#e6edf5";
    ctx.font = "18px sans-serif";
    const lines = (promptText || "S.H.A.D.O.W. Visual").match(/.{1,48}/g) || [];
    lines.slice(0, 6).forEach((line, idx) => {
      ctx.fillText(line, 48, 125 + idx * 32);
    });
    return c.toDataURL("image/png");
  }

  function downloadFile(name, content) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([content], { type: "text/plain;charset=utf-8" }));
    a.download = name || "output.txt";
    a.click();
  }

  function parseFileBlocks(text, attachedDocs) {
    const blocks = [];
    const re = /```([a-zA-Z0-9_-]*)(?::([^\n]+))?\n([\s\S]*?)```/g;
    let m, idx = 1;
    while ((m = re.exec(text)) !== null) {
      const defaultName = attachedDocs[0] ? "edited-" + attachedDocs[0].name : `output-${idx}.${m[1] || "txt"}`;
      const fname = (m[2] && m[2].trim()) || defaultName;
      blocks.push({ name: fname, content: m[3] });
      idx++;
    }
    if (blocks.length === 0 && mode === "file" && text.trim()) {
      const fallbackName = attachedDocs[0] ? "edited-" + attachedDocs[0].name : "shadow-file.txt";
      blocks.push({ name: fallbackName, content: text });
    }
    return blocks;
  }

  function buildMemoryContext() {
    const knowledge = (document.getElementById("knowledgeInput").value || "").trim();
    const memBlock = memories.length ? "รายการความจำที่ต้องยึดถือ:\n- " + memories.join("\n- ") : "";
    const knowBlock = knowledge ? "คลังข้อมูลอ้างอิง:\n" + knowledge : "";
    return [memBlock, knowBlock].filter(Boolean).join("\n\n");
  }

  async function send() {
    const inp = document.getElementById("prompt");
    const text = inp.value.trim();
    const batch = [...files];
    if (!text && batch.length === 0) return;

    const chat = document.getElementById("chat");
    const uDiv = document.createElement("div");
    uDiv.className = "msg user";

    batch.forEach(f => {
      if (f.isImg && f.url) {
        const img = document.createElement("img");
        img.src = f.url;
        uDiv.appendChild(img);
      }
    });

    const labelText = document.createElement("div");
    labelText.textContent = (text || (batch.some(x => x.isImg) ? "ดูรูปภาพนี้" : "วิเคราะห์ไฟล์นี้")) +
      (batch.length ? "\n[" + batch.map(x => x.name).join(", ") + "]" : "");
    uDiv.appendChild(labelText);
    chat.appendChild(uDiv);

    inp.value = "";
    files = [];
    renderFiles();

    const aDiv = document.createElement("div");
    aDiv.className = "msg ai";
    chat.appendChild(aDiv);

    const memorizedText = extractRememberCommand(text);
    if (memorizedText && batch.length === 0 && mode === "chat") {
      memories.push(memorizedText);
      renderMemories();
      aDiv.textContent = `จำไว้แล้วครับ MJ: "${memorizedText}" — หยิบมาใช้ต่อได้ตลอดเลย`;
      chat.scrollTop = chat.scrollHeight;
      return;
    }

    aDiv.textContent = "กำลังประมวลผล...";
    chat.scrollTop = chat.scrollHeight;

    if (mode === "image") {
      const memNote = buildMemoryContext();
      const dataUrl = await buildImageOutput(memNote ? `${text} | ${memNote.slice(0, 180)}` : text);
      aDiv.innerHTML = "";
      const img = document.createElement("img");
      img.src = dataUrl;
      const btn = document.createElement("button");
      btn.className = "primary";
      btn.type = "button";
      btn.textContent = "⬇ ดาวน์โหลดรูป";
      btn.onclick = () => {
        const a = document.createElement("a");
        a.href = dataUrl;
        a.download = "shadow-image.png";
        a.click();
      };
      aDiv.appendChild(img);
      aDiv.appendChild(btn);
      chat.scrollTop = chat.scrollHeight;
      return;
    }

    const url = document.getElementById("urlInput").value.trim().replace(/\/$/, "");
    const model = document.getElementById("models").value;
    if (!url || !model) {
      aDiv.textContent = "ตั้งค่า URL ใน ⚙️ และเลือกโมเดลก่อนครับ";
      return;
    }

    const docList = batch.filter(x => !x.isImg);
    const docText = docList.map(x => `\n--- ไฟล์: ${x.name} ---\n${x.text}\n--- จบไฟล์ ${x.name} ---`).join("");
    const imgs = batch.filter(x => x.isImg).map(x => x.b64);

    let promptOut = (text || (imgs.length ? "อธิบายและวิเคราะห์รูปภาพนี้" : "วิเคราะห์ไฟล์นี้")) + docText;
    if (mode === "file") {
      promptOut += "\n[คำสั่งสร้าง/แก้ไขไฟล์: ส่งเนื้อหาไฟล์ฉบับเต็มไว้ในโค้ดบล็อก ```นามสกุล:ชื่อไฟล์``` เพื่อให้แก้ไขและดาวน์โหลดได้ทันที]";
    }
    if (!thinkOn) promptOut = "/no_think " + promptOut;

    const msg = { role: "user", content: promptOut };
    if (imgs.length) msg.images = imgs;
    history.push(msg);

    const baseSys = document.getElementById("sysInput").value.trim();
    const memContext = buildMemoryContext();
    const sys = [baseSys, memContext].filter(Boolean).join("\n\n");
    const messages = sys ? [{ role: "system", content: sys }, ...history] : history;

    try {
      const r = await fetch(url + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model,
          stream: false,
          options: { num_ctx: parseInt(document.getElementById("ctxInput").value, 10) || 4096 },
          messages
        })
      });
      const d = await r.json();
      const raw = (d.message && d.message.content) || "";
      history.push({ role: "assistant", content: raw });

      aDiv.innerHTML = "";
      let bodyText = raw;
      const tm = raw.match(/<think>([\s\S]*?)<\/think>/i);
      if (tm) {
        bodyText = raw.replace(/<think>[\s\S]*?<\/think>/i, "").trim();
        if (thinkOn) {
          const det = document.createElement("details");
          det.className = "think";
          det.innerHTML = `<summary>🧠 ความคิด</summary><div>${tm[1].trim().replace(/</g, "<")}</div>`;
          aDiv.appendChild(det);
        }
      }

      const p = document.createElement("div");
      p.textContent = bodyText;
      aDiv.appendChild(p);

      const fileBlocks = parseFileBlocks(bodyText, docList);
      fileBlocks.forEach(fb => {
        const box = document.createElement("div");
        box.className = "file-box";
        const nameIn = document.createElement("input");
        nameIn.value = fb.name;
        const dl = document.createElement("button");
        dl.className = "primary";
        dl.type = "button";
        dl.style.marginLeft = "6px";
        dl.textContent = "⬇ โหลดไฟล์";
        const ed = document.createElement("textarea");
        ed.value = fb.content;
        dl.onclick = () => downloadFile(nameIn.value.trim(), ed.value);
        box.appendChild(nameIn);
        box.appendChild(dl);
        box.appendChild(ed);
        aDiv.appendChild(box);
      });
    } catch {
      aDiv.textContent = "เชื่อมต่อไม่ได้";
    }
    chat.scrollTop = chat.scrollHeight;
  }

  window.onload = () => {
    const q = new URLSearchParams(location.search).get("url");
    if (q) localStorage.setItem("shadow_url", q.trim());
    if (localStorage.getItem("shadow_url")) document.getElementById("urlInput").value = localStorage.getItem("shadow_url");
    if (localStorage.getItem("shadow_img_api")) document.getElementById("imgApiInput").value = localStorage.getItem("shadow_img_api");
    if (localStorage.getItem("shadow_ctx")) document.getElementById("ctxInput").value = localStorage.getItem("shadow_ctx");
    if (localStorage.getItem("shadow_sys")) document.getElementById("sysInput").value = localStorage.getItem("shadow_sys");
    if (localStorage.getItem("shadow_knowledge")) document.getElementById("knowledgeInput").value = localStorage.getItem("shadow_knowledge");
    try {
      memories = JSON.parse(localStorage.getItem("shadow_memories") || "[]");
      if (!Array.isArray(memories)) memories = [];
    } catch {
      memories = [];
    }
    renderMemories();
    loadModels();
  };
</script>
</body>
</html>
